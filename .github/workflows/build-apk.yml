name: Build Movsic APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Extract Movsic HTML into www
        run: |
          mkdir -p www tmp_extract
          unzip -o "*.zip" -d tmp_extract
          cp "$(find tmp_extract -name 'index.html' | head -n 1)" www/index.html
          ls -lh www/index.html
      - name: Install Capacitor & Add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Movsic-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
